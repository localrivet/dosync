# Simple Environment Variable Expansion Test
# This configuration demonstrates basic env var expansion

checkInterval: "${TEST_INTERVAL}"
verbose: true

registry:
  ghcr:
    token: "${GITHUB_PAT}"
    imagePolicy:
      policy:
        alphabetical:
          order: desc

  dockerhub:
    username: "${DOCKERHUB_USER}"
    password: "${DOCKERHUB_PASS}"
    imagePolicy:
      policy:
        alphabetical:
          order: desc 
# Complex Environment Variable Expansion Test
# This configuration demonstrates various env var expansion patterns

# Alternative field name formats (all should work)
interval: "${CHECK_INTERVAL}"  # Using 'interval' instead of 'checkInterval'
verbose: true

registry:
  # GitHub Container Registry with token expansion
  ghcr:
    token: "${GITHUB_TOKEN}"
    imagePolicy:  # Using 'imagePolicy' instead of 'image_policy'
      policy:
        alphabetical:
          order: desc

  # Docker Hub with credential expansion
  dockerhub:
    username: "${DOCKERHUB_USER}"
    password: "${DOCKERHUB_PASS}"
    imagePolicy:
      policy:
        semver:
          range: ">=1.0.0"

  # Example with mixed env vars and static values
  custom:
    url: "https://registry.example.com"
    username: "${CUSTOM_USER:-defaultuser}"  # With default fallback
    password: "${CUSTOM_PASS}"
    imagePolicy:
      filterTags:
        pattern: "^v?([0-9]+\\.[0-9]+\\.[0-9]+)$"
        extract: "$1"
      policy:
        numerical:
          order: desc

# Dashboard config with env expansion
dashboard:
  enabled: true
  port: "${DASHBOARD_PORT:-8080}"
  user: "${DASHBOARD_USER:-admin}"
  pass: "${DASHBOARD_PASS:-secret}" 
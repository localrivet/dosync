# Complex Environment Variable Expansion Test
# This configuration demonstrates various env var expansion patterns

# Alternative field name formats (all should work)
checkInterval: "${TEST_INTERVAL}"
verbose: true

registry:
  # GitHub Container Registry with token expansion
  ghcr:
    token: "${GITHUB_PAT}"
    imagePolicy:
      policy:
        alphabetical:
          order: desc

  # Docker Hub with credential expansion
  dockerhub:
    username: "${DOCKERHUB_USER}"
    password: "${DOCKERHUB_PASS}"
    imagePolicy:
      policy:
        alphabetical:
          order: desc

# Dashboard config with env expansion
dashboard:
  enabled: true
  port: "${DASHBOARD_PORT:-8080}"
  user: "${DASHBOARD_USER:-admin}"
  pass: "${DASHBOARD_PASS:-secret}"

rollingUpdate: true
healthCheck: http
healthEndpoint: /api/health
delay: 30s
rollbackOnFailure: true

services:
  app:
    healthCheck: http
    healthEndpoint: /api/health
    delay: 45s
    maxUnavailable: 0
  
  postgres:
    skip: true
    
  traefik:
    healthCheck: http
    healthEndpoint: /api/version
    delay: 15s 